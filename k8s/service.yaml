apiVersion: v1
kind: Service
metadata:
  name: linhamestre-service
  labels:
    app: linhamestre
spec:
  type: NodePort
  selector:
    app: linhamestre
  # O Streamlit usa WebSocket; mantém o cliente no mesmo pod caso haja réplicas no futuro.
  sessionAffinity: ClientIP
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
