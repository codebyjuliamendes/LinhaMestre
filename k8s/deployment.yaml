apiVersion: apps/v1
kind: Deployment
metadata:
  name: linhamestre
  labels:
    app: linhamestre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linhamestre
  template:
    metadata:
      labels:
        app: linhamestre
    spec:
      containers:
      - name: linhamestre
        image: codebyjuliamendes/linhamestre:latest
        ports:
        - containerPort: 8501
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 20
