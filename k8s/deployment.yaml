# SQLite é um arquivo local: a aplicação roda com UMA réplica e volume persistente.
# Para escalar horizontalmente seria preciso migrar para um banco em rede.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linhamestre-data
  labels:
    app: linhamestre
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linhamestre
  labels:
    app: linhamestre
spec:
  replicas: 1
  strategy:
    type: Recreate # evita dois pods gravando o mesmo arquivo SQLite
  selector:
    matchLabels:
      app: linhamestre
  template:
    metadata:
      labels:
        app: linhamestre
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: linhamestre
          image: codebyjuliamendes/linhamestre:latest # prefira uma tag de versão imutável
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: LINHAMESTRE_DB_PATH
              value: /data/linhamestre.db
            - name: LINHAMESTRE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linhamestre-secrets
                  key: admin-password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linhamestre-data
