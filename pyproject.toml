[project]
name = "linhamestre"
version = "1.1.0"
description = "Painel de controle estatístico de qualidade e gestão de estoque em Streamlit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Júlia Mendes" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "xlsxwriter>=3.2",
]

[project.scripts]
linhamestre-seed = "linhamestre.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linhamestre"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF", "PT", "PL"]
ignore = [
    "PLR0913", # funções de repositório recebem vários campos
    "PLR0915",
    "PLR0912",
    "PLR2004",
    "PLR0917",
    "RUF001",  # textos em português usam caracteres tipográficos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLC0415", "E501", "SIM300"]
"src/linhamestre/seed.py" = ["E501", "S311"] # tabela de dados fictícios; random só para dados de demonstração
"src/linhamestre/db.py" = ["S608"] # SQL montado só com fragmentos fixos; valores via parâmetros

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["linhamestre"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["linhamestre.ui.*", "linhamestre.app"]
# Widgets do Streamlit retornam tipos amplos; mantemos checagem estrita no domínio e dados.
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:linhamestre.*"]

[tool.coverage.run]
source = ["linhamestre"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
