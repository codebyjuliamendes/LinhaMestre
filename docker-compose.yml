services:
  linhamestre:
    build: .
    image: linhamestre:local
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      LINHAMESTRE_DB_PATH: /data/linhamestre.db
    volumes:
      - linhamestre-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  linhamestre-data:
