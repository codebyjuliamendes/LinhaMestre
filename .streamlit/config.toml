[server]
headless = true
port = 8501
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 5
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[theme]
base = "dark"
font = "sans-serif"

[theme.light]
primaryColor = "#0369a1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"

[theme.dark]
primaryColor = "#0284c7"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
