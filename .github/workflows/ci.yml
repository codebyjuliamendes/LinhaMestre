name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Testes
        run: uv run pytest --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: linhamestre:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name lm -p 8501:8501 -e LINHAMESTRE_ADMIN_PASSWORD=Smoke-test-123 linhamestre:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          test "$(docker inspect -f '{{.Config.User}}' lm)" = "app"
          docker exec lm python seed_db.py --random-seed 1
      - name: Logs
        if: always()
        run: docker logs lm || true
